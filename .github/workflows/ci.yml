name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The lockfile pins Prisma's generated client, so `npm ci` reproduces the
      # exact tree rather than resolving fresh versions.
      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Vite inlines VITE_API_URL at build time; a placeholder keeps the
          # build from warning. The real value is set in Vercel.
          VITE_API_URL: https://example.invalid/api

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: client

      # A throwaway Postgres for the run. The E2E specs hit the real API, so a
      # live database is required — Neon is not wired in here on purpose.
      - name: Start PostgreSQL
        run: |
          docker run -d --name mindcheck-db \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=mindcheck_test \
            -p 5432:5432 postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec mindcheck-db pg_isready -U postgres && break
            sleep 1
          done

      - name: Apply migrations and seed
        run: |
          npm run db:deploy
          npm run db:seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mindcheck_test
          JWT_SECRET: ci-only-secret-at-least-32-characters-long
          JWT_EXPIRES_IN: 7d
          CORS_ORIGIN: http://localhost:5173
          CLIENT_URL: http://localhost:5173
          NODE_ENV: test

      - name: Run E2E
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mindcheck_test
          JWT_SECRET: ci-only-secret-at-least-32-characters-long
          JWT_EXPIRES_IN: 7d
          CORS_ORIGIN: http://localhost:5173
          CLIENT_URL: http://localhost:5173
          NODE_ENV: test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7
